
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Realidade Aumentada</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam;">

    <a-marker preset="hiro">
      <a-box
        position="0 0.5 0"
        color="red"
        material="opacity: 0.8;">
      </a-box>

      <a-text
        value="Ola! Bem-vindo a minha AR"
        position="-1 1.2 0"
        color="black"
        align="center">
      </a-text>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
